name: Action Resolution

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  action-resolution:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run action resolution tests
        run: node tests/action_resolution.test.js
